<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b2b">
  <meta name="description" content="The October Decision: a six round educational simulation about intelligence and leadership before the 1973 Yom Kippur War, created for StandWithUs UK Explore.">
  <title>The October Decision | StandWithUs UK Explore</title>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script defer src="assets/js/data.js"></script>
  <script defer src="assets/js/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to main content</a>
  <div class="app-shell">
    <header class="site-header">
      <div class="header-brand">
        <img class="swu-logo" src="assets/images/swu-uk.svg" alt="StandWithUs UK" width="178" height="51">
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="brand-programme">EXPLORE <span class="brand-small">EDUCATION SERIES</span></span>
      </div>
      <div class="header-actions">
        <span class="header-label" id="header-mode">HISTORICAL SIMULATION</span>
        <button id="help-button" type="button" class="text-button" aria-label="How this simulation works">HOW TO PLAY</button>
        <button id="reset-button" type="button" class="text-button subtle" hidden>START AGAIN</button>
      </div>
    </header>
    <main id="main" tabindex="-1" aria-live="polite"></main>
    <footer class="site-footer">
      <span>STANDWITHUS UK <span class="dot-separator">•</span> EXPLORE</span>
      <span>1973 HISTORY <span class="dot-separator">•</span> EDUCATIONAL SIMULATION</span>
      <button type="button" id="sources-button" class="footer-link">HISTORICAL SOURCES &amp; IMAGE NOTES</button>
    </footer>
  </div>
  <dialog id="info-dialog" class="info-dialog" aria-labelledby="dialog-title">
    <div class="dialog-inner">
      <div class="dialog-header"><h2 id="dialog-title">About this simulation</h2><button type="button" class="icon-button" id="dialog-close" aria-label="Close information">✕</button></div>
      <div id="dialog-content"></div>
    </div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
